# sops configuration — defines which age keys can decrypt each secret file.
#
# Key derivation:
#   User key    : age-keygen (stored at ~/.config/age/keys.txt)
#   Host keys   : derived from each host's SSH ed25519 host key at deploy time:
#                   ssh-keyscan <host> | ssh-to-age
#
# To add a new host:
#   1. nix-shell -p ssh-to-age --run 'ssh-keyscan <host-ip> | ssh-to-age'
#   2. Add the result below and uncomment the server reference in creation_rules.
#   3. Re-encrypt all secrets: sops updatekeys secrets/<file>
#
# To encrypt a new secret:
#   sops --encrypt secrets/mysecret.env > secrets/mysecret.env  (in-place)
#   or: sops secrets/mysecret.env  (opens $EDITOR)

keys:
  # User key — always included so secrets can be edited from any machine.
  - &ewan age1xl8ptkqm03skrdadqgprnez3trrc0k9t0ex052lweewqre2zc9qq7ljm3z

  # Host keys — derived from /etc/ssh/ssh_host_ed25519_key on each machine.
  # sops-nix decrypts at activation time using the host's own key.
  - &macmini age10ysmz3603uupz0043mpznchtnh6jsnk5cu3eg05xalma4xjacppsgupgvj
  - &laptop age1s4exn5venvd2rkrvw9g6g9rua05quut62m6le8k79st0dryhcy3qq4n55k
  - &server age1xvny7h8cahajamj4lz9cew5w0dqlge0yy6tys7szj42grcrl95jqsrutsu

creation_rules:
  # ── Secrets available on all machines ──────────────────────────────────────
  - path_regex: secrets/(wifi-home|ssh-passphrase|docker-config\.json|claude\.json)$
    key_groups:
      - age:
          - *ewan
          - *macmini
          - *laptop
          - *server

  # ── Server-only secrets ─────────────────────────────────────────────────────
  - path_regex: secrets/(pds\.env|cloudflare\.token|cf-tunnel\.json|forgejo\.env|nextcloud-admin-pass|nextcloud-secrets\.json)$
    key_groups:
      - age:
          - *ewan
          - *server

  # ── Fallback: any other file under secrets/ ─────────────────────────────────
  - path_regex: secrets/.*
    key_groups:
      - age:
          - *ewan
          - *macmini
          - *laptop
          - *server
