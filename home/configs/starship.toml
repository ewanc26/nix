"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 3000

format = """
[](color_lime)\
$os\
$username\
[](bg:color_leaf fg:color_lime)\
$directory\
[](fg:color_leaf bg:color_sage)\
$git_branch\
$git_status\
[](fg:color_sage bg:color_emerald)\
$aws\
$c\
$cpp\
$cmake\
$crystal\
$dart\
$deno\
$elixir\
$elm\
$fennel\
$fortran\
$golang\
$gradle\
$haskell\
$haxe\
$java\
$julia\
$kotlin\
$lua\
$meson\
$nim\
$nodejs\
$ocaml\
$perl\
$php\
$python\
$rlang\
$ruby\
$rust\
$scala\
$swift\
$xmake\
$zig\
[](fg:color_emerald bg:color_bg3)\
$docker_context\
$conda\
$pixi\
$nix_shell\
$guix_shell\
$package\
$memory_usage\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'forest_dark'

[palettes.forest_dark]
color_fg0 = '#f0faf0'
color_bg1 = '#09150a'
color_bg3 = '#245327'
color_emerald = '#00a751'
color_sage = '#009b22'
color_moss = '#007713'
color_lime = '#679500'
color_fern = '#005f2a'
color_forest = '#00570c'
color_leaf = '#88b115'

# --- OS & USER ---

[os]
disabled = false
style = "bg:color_lime fg:color_fg0"

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Ios = "󰀷 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[username]
show_always = true
style_user = "bg:color_lime fg:color_fg0"
style_root = "bg:color_lime fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_leaf"
format = "[ $path ]($style)[$read_only]($style)"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# --- GIT ---

[git_branch]
symbol = " "
style = "bg:color_sage"
format = '[[ $symbol$branch ](fg:color_fg0 bg:color_sage)]($style)'

[git_status]
style = "bg:color_sage"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_sage)]($style)'

[git_commit]
tag_symbol = '  '

# --- LANGUAGES & TOOLS (Emerald Block) ---

[aws]
symbol = " "
style = "bg:color_emerald"
format = '[[ $symbol( $profile) ](fg:color_fg0 bg:color_emerald)]($style)'

[buf]
symbol = " "
style = "bg:color_emerald"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_emerald)]($style)'

