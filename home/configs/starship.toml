# --- CONTAINERS & ENV (Darker Green Block) ---

[docker_context]
symbol = " "
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[conda]
symbol = " "
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'

[pixi]
symbol = "󰏗 "
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[nix_shell]
symbol = " "
style = "bg:color_bg3"
format = '[[ $symbol( $state) ](fg:color_fg0 bg:color_bg3)]($style)'

[guix_shell]
symbol = " "
style = "bg:color_bg3"
format = '[[ $symbol ](fg:color_fg0 bg:color_bg3)]($style)'

[package]
symbol = "󰏗 "
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg3)]($style)'

[memory_usage]
symbol = "󰍛 "
style = "bg:color_bg3"
format = '[[ $symbol( $ram) ](fg:color_fg0 bg:color_bg3)]($style)'

# --- SYSTEM & TIME ---

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_moss)'
error_symbol = '[](bold fg:color_forest)'
vimcmd_symbol = '[](bold fg:color_moss)'
vimcmd_replace_one_symbol = '[](bold fg:color_fern)'
vimcmd_replace_symbol = '[](bold fg:color_fern)'
vimcmd_visual_symbol = '[](bold fg:color_leaf)'
